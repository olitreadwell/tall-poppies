<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cyber Y2K, tomorrow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Michroma&family=Space+Grotesk:wght@400;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: #222;
      }
      body {
        display: flex;
        justify-content: center;
      }
      .post {
        width: 1080px;
        height: 1350px;
        position: relative;
        overflow: hidden;
        background: #070b14;
        color: #dce6f2;
        font-family: 'Space Grotesk', sans-serif;
      }
      .win {
        position: absolute;
        left: 64px;
        top: 54px;
        width: 952px;
        height: 1242px;
        background: #0b1220;
        border: 4px solid #8fa6c4;
      }
      .bar {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 56px;
        background: url('../favorites/patterns/y2k-chrome/chrome-ramp.svg') center/cover;
        border-bottom: 4px solid #8fa6c4;
      }
      .dot {
        position: absolute;
        top: 18px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 3px solid #1b2e4b;
      }
      .d1 {
        left: 22px;
        background: #ff2d87;
      }
      .d2 {
        left: 48px;
        background: #ffe94a;
      }
      .d3 {
        left: 74px;
        background: #00e5c0;
      }
      .barname {
        position: absolute;
        left: 108px;
        top: 17px;
        font-family: 'Michroma', sans-serif;
        font-size: 15px;
        letter-spacing: 0.12em;
        color: #1b2e4b;
      }
      .kicker {
        position: absolute;
        left: 106px;
        top: 146px;
        font-family: 'Space Mono', monospace;
        font-size: 17px;
        letter-spacing: 0.16em;
        color: #00e5c0;
      }
      .chrome {
        position: absolute;
        left: 100px;
        top: 204px;
        font-family: 'Orbitron', sans-serif;
        font-weight: 900;
        font-size: 122px;
        line-height: 0.94;
        letter-spacing: -0.055em;
        background: linear-gradient(
          180deg,
          #ffffff 0%,
          #dce6f2 28%,
          #8fa6c4 52%,
          #ffffff 70%,
          #5c7fb8 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .star {
        position: absolute;
        right: 92px;
        top: 92px;
        width: 122px;
        height: 122px;
      }
      .date {
        position: absolute;
        left: 106px;
        top: 356px;
        font-family: 'Orbitron', sans-serif;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .venue {
        position: absolute;
        left: 106px;
        top: 402px;
        width: 700px;
        font-size: 26px;
        line-height: 1.32;
        font-weight: 700;
        color: #dce6f2;
      }
      .venue b {
        color: #00e5c0;
      }
      .rule {
        position: absolute;
        left: 106px;
        top: 494px;
        width: 860px;
        height: 3px;
        background: #00e5c0;
      }
      .term {
        position: absolute;
        left: 106px;
        top: 528px;
        width: 860px;
        height: 200px;
        background: #05080f;
        border: 3px solid #00e5c0;
        padding: 24px 28px;
      }
      .term p {
        font-family: 'Space Mono', monospace;
        font-size: 24px;
        line-height: 1.55;
        letter-spacing: 0.01em;
        color: #dce6f2;
      }
      .term b {
        color: #00e5c0;
        font-weight: 700;
      }
      .photo {
        position: absolute;
        left: 106px;
        top: 770px;
        width: 512px;
        height: 300px;
        border: 3px solid #8fa6c4;
        overflow: hidden;
        background: #05080f;
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        filter: grayscale(1) contrast(1.1);
      }
      .photo:after {
        content: '';
        position: absolute;
        inset: 0;
        background: #00e5c0;
        mix-blend-mode: multiply;
        opacity: 0.9;
      }
      .count {
        position: absolute;
        left: 650px;
        top: 770px;
        width: 316px;
        height: 300px;
        border: 3px solid #8fa6c4;
        padding: 18px 20px;
      }
      .count .n {
        font-family: 'Orbitron', sans-serif;
        font-size: 104px;
        font-weight: 900;
        line-height: 0.9;
        color: #00e5c0;
        letter-spacing: -0.05em;
      }
      .count .u {
        font-family: 'Michroma', sans-serif;
        font-size: 17px;
        letter-spacing: 0.18em;
        margin-top: 4px;
      }
      .count .doors {
        font-family: 'Space Mono', monospace;
        font-size: 18px;
        line-height: 1.45;
        margin-top: 16px;
        color: #dce6f2;
      }
      .pill {
        position: absolute;
        left: 106px;
        top: 1144px;
        width: 860px;
        height: 100px;
        border-radius: 999px;
        background: linear-gradient(180deg, #ffffff 0%, #dce6f2 30%, #8fa6c4 62%, #1e3fa8 100%);
        border: 4px solid #dce6f2;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 25px;
        font-weight: 900;
        letter-spacing: 0.13em;
        color: #1b2e4b;
      }
      .scan {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.055) 0 1px,
          transparent 1px 4px
        );
        pointer-events: none;
      }
      .tag {
        position: absolute;
        left: 64px;
        bottom: 20px;
        font-family: 'Space Mono', monospace;
        font-size: 13px;
        letter-spacing: 0.12em;
        color: #8fa6c4;
      }
    </style>
  </head>
  <body>
    <div class="post">
      <div class="win">
        <div class="bar">
          <span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span
          ><span class="barname">MEETUP.EXE</span>
        </div>
        <div class="kicker">SYSTEM // WELLINGTON // 2026</div>
        <div class="chrome">TOMORROW</div>
        <img class="star" src="../favorites/patterns/y2k-chrome/star-four.svg" alt="" />
        <div class="date">WED 25 NOV / 5PM TO 8PM</div>
        <div class="venue"><b>ROSIE'S RED-HOT CANTINA</b><br />4 QUEENS WHARF, WELLINGTON</div>
        <div class="rule"></div>
        <div class="term">
          <p>
            &gt; STATUS: <b>ALL WELCOME</b><br />&gt; BRING: <b>A MATE</b><br />&gt; DUCKING
            REQUIRED: <b>NONE</b>
          </p>
        </div>
        <div class="photo">
          <img src="../photos/20-cyberpunk.jpg" alt="City screens at night" />
        </div>
        <div class="count">
          <div class="n">T-01</div>
          <div class="u">DAY</div>
          <div class="doors">DOORS 17:00<br />NO TICKET<br />JUST TURN UP</div>
        </div>
        <div class="pill">ALL WELCOME / BRING A MATE</div>
      </div>
      <div class="scan"></div>
      <div class="tag">CYBER Y2K / 1999 TO 2020</div>
    </div>
  </body>
</html>
